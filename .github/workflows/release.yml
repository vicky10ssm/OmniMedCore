name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          Write-Host "Tag:            $tag"
          Write-Host "package.json:   $packageVersion"
          Write-Host "tauri.conf:     $tauriVersion"

          if ($tag -ne $packageVersion) {
            throw "Tag v$tag does not match package.json version $packageVersion"
          }
          if ($tag -ne $tauriVersion) {
            throw "Tag v$tag does not match src-tauri/tauri.conf.json version $tauriVersion"
          }

      - name: Install npm dependencies
        run: npm ci

      - name: Run application checks
        run: npm run check

      - name: Build Tauri installers
        run: npm run tauri build

      - name: List generated installers
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medicore-windows-installers
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MediCore ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
