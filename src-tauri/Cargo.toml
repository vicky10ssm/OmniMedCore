[package]
name = "medicore"
version = "0.15.1"
description = "OmniMed Core offline billing and care operations"
authors = ["OmniMed Core"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "medicore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
getrandom = "0.2"
zeroize = "1"
hex = "0.4"
sha2 = "0.10"
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }

[patch.crates-io]
# Bundled SQLCipher uses libtomcrypt on Windows, so the desktop build does not
# depend on a system OpenSSL installation.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
